name: Publish Scrollfly

on:
  push:
    branches: [codex/github-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Retrieve verified website bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile
          manifest = json.loads(pathlib.Path('publication.json').read_text())
          subprocess.run(['gh', 'release', 'download', manifest['release'], '--repo', os.environ['GH_REPO'], '--pattern', manifest['asset']], check=True)
          archive = pathlib.Path(manifest['asset'])
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == manifest['sha256'], 'Bundle checksum mismatch'
          with tarfile.open(archive, 'r:gz') as source:
              assert all(member.isfile() and not member.name.startswith('/') and '..' not in pathlib.PurePosixPath(member.name).parts for member in source.getmembers())
              source.extractall('_site', filter='data')
          site = pathlib.Path('_site')
          replay = json.loads((site / 'replay.json').read_text())
          assert len(replay['clips']) == manifest['videos']
          assert replay['clips'][0]['content_id'] == manifest['first_video']
          assert not (site / 'videos/34408.mp4').exists()
          assert not (site / 'brain-34408.json').exists()
          for page in manifest.get('pages', ['index.html']):
              assert (site / page).is_file(), f'Missing page: {page}'
          for path in pathlib.Path('site').rglob('*'):
              if path.is_file():
                  relative = path.relative_to('site')
                  assert path.read_bytes() == (site / relative).read_bytes(), f'Source differs from bundle: {relative}'
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
